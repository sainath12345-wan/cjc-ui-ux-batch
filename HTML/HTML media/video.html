<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML MEDIA : video</title>
</head>
<body>
    <video width="320" height="240" controls  autoplay muted>
        <source src = "Uyi amma.mp4" type="video/mp4">
        Your Broswer Does Not Support the Video file.
    </video>
</body>
</html>


<!-- 
    Definition and Usage
    The <video> tag is used to embed video content (like movies or video clips) in a webpage.

    It can contain one or more <source> tags to provide multiple video formats for cross-browser compatibility.

    The browser plays the first supported format.

    Text between <video> and </video> appears only if the browser does not support the video element.

    Example

    <video width="320" height="240" controls>
    <source src="movie.mp4" type="video/mp4">
    <source src="movie.ogg" type="video/ogg">
    Your browser does not support the video tag.
    </video>

    Supported Video Formats
    MP4 (video/mp4)

    WebM (video/webm)

    OGG (video/ogg)



    Common <video> Tag Attributes
        
    Attribute	Value	            Description
    controls	controls	        Displays video controls like play, pause, volume, etc.
    autoplay	autoplay	        Starts playing video as soon as it's ready
    loop	    loop	            Restarts video after it finishes
    muted	    muted	            Mutes the video by default
    preload	    auto metadata none	Specifies whether to preload the video or not
    poster	    URL	                Specifies an image to be shown while the video is downloading
    width	    pixels	            Sets the width of the video player
    height	    pixels	            Sets the height of the video player
    src	URL	    Specifies           the video file source (used when no <source> tags)
    
-->
