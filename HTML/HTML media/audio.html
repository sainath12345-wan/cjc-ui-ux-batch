<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML MEDIA - audio</title>
</head>
<body>
    <audio controls autoplay>
        <source src="Uyi amma.mpeg" type="audio/mp3">
        Your Borwser Unable To Play This Audio File.
    </audio>

        <!-- 
    
        HTML <audio> Tag

        Example
        Play a sound file:

        <audio controls>
            <source src="horse.ogg" type="audio/ogg">
            <source src="horse.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        Definition and Usage

        The <audio> tag is used to embed sound content in a document, such as music or other audio streams.
        The <audio> tag contains one or more <source> tags with different audio sources. The browser will choose the first source it supports.
        The text between the <audio> and </audio> tags will only be displayed in browsers that do not support the <audio> element.
        There are three supported audio formats in HTML: MP3, WAV, and OGG.

       
        

        
        Attributes

        Attribute	        Value	                Description
        autoplay	        autoplay	            Specifies that the audio will start playing as soon as it is ready
        controls	        controls	            Specifies that audio controls should be displayed (such as a play/pause button etc)
        loop	            loop	                Specifies that the audio will start over again, every time it is finished
        muted	            muted	                Specifies that the audio output should be muted
        preload	            auto metadata none	    Specifies if and how the author thinks the audio should be loaded when the page loads
        src	                URL	                    Specifies the URL of the audio file
        -->

</body>
</html>
