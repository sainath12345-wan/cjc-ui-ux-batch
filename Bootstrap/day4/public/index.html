<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap workshop : session 3</title>

    <!-- Bootstrap CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container-fluid">

    <button class="btn btn-primary mt-2" data-bs-toggle="modal" data-bs-target="#login">Login</button>
    <button class="btn btn-success mt-2" data-bs-toggle="modal" data-bs-target="#details">Fashion</button>



    <!-- Details Modal -->
     <div class="modal fade" id="details">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Women Fashion</h2>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <img src="./images/young-woman-beautiful-yellow-dress.jpg" alt="women fashion img" height="200" width="200">
                </div>
                <div class="modal-footer">

                </div>

            </div>
        </div>
     </div>

    <!-- 
    Modals

        In a page there can be several models one for login, one for register , one for product details etc. then every modal needs an id for (unique id).
    -->

    <!-- modal creation -->
     <!-- Login Modal -->
    <div class="modal fade" id="login">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="bi bi-person-fill">User Login</h1>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <dl>
                        <dt>User Name</dt>
                        <dd>
                            <input type="text" name="username" id="username" class="form-control">
                        </dd>
                        <dt>Password</dt>
                        <dd>
                            <input type="password" name="password" id="password" class="form-control">
                        </dd>
                    </dl>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary">Login</button>
                    <button class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>
     <!-- 
        we create the modal but we cannot seen on the webpage. because modal are the dialog and and dialogs are usually hidden.

        Now we need to open this modal when user click on button.

        to handle such scenario modal have some attributes. 

        If we have to dismiss any component we have attribute like data-bs-dismiss. data-bs-dismiss attribute is used to close component on click.
     -->

     <!-- 
     steps to open a modal  on click.

     we have to add attribute data-bs-toggle of modal on where we can click on that element after the modal open. (toggle means if it first click it open and next click it close of that event. e.g. theme color of websites.)

     write the data-bs-toggle value as modal.

     but there are many modals are present so to identify particular modal  Modal have another attribute as data-bs-target which value is id of that particular modal when we click on that button it will open.

     If we want to add animation at the time of open that modal so there another class is present .fade.

     If we want to close the any modal on click then we have attribute like data-bs-dismiss and its value will be modal.

     If you want to open modal at centered of page then you have use modal-dialog-centered  in modal-dialog continer.

     If you want to open modal as full screen then you have to use modal-fullscreen in modal-dialog container.

     If your modal have lots of fileds or content and you want to make it scrollable then you have to use class modal-dialog-scrollable in contianer modal-diaglog.
     -->


    <button class="btn btn-danger mt-2" data-bs-toggle="modal" data-bs-target="#register">Register</button>

     <!-- Register Modal -->

     <div class="modal " id="register">
        <div class="modal-dialog">
            <div class="modal-content">
                <form action="">
                <div class="modal-header">
                    <h1 class="bi bi-person-fill">Registration Form</h1>
                    <button class="btn btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <dl>
                        <dt class="form-label">User Name</dt>
                        <dd>
                            <input type="text" name="username" id="username" class="form-control">
                        </dd>
                        <dt class="form-label">Email</dt>
                        <dd>
                            <input type="email" name="email" id="email" class="form-control">
                        </dd>
                        <dt class="form-label">DOB</dt>
                        <dd>
                            <input type="date" class="form-control" name="dob" id="dob">
                        </dd>
                    </dl>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary w-100 " type="submit">Register</button>
                    <button class="btn btn-warning w-100" type="reset">Reset</button>
                </div>
                </form>
            </div>
        </div>
     </div>
</body>
</html>
