<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body class="container-fluid">

  <h1>Basic Carousel : With Slide</h1>
  <!-- Basic Carousel -->

  <div class="carousel slide" data-bs-ride="carousel" id="carousel-1">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./images/slide1.png" height="200" class="w-100 d-block">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide2.png" height="200" alt="img 2" class="d-block w-100">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide3.png" height="200" alt="img 3" class="d-block w-100">
      </div>
    </div>
  </div>


  <h1>Basic Carousel : With Fade</h1>

  <div class="carousel carousel-fade" data-bs-ride="carousel" id="carousel-1">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./images/slide1.png" height="200" class="w-100 d-block">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide2.png" height="200" alt="img 2" class="d-block w-100">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide3.png" height="200" alt="img 3" class="d-block w-100">
      </div>
    </div>
  </div>

  <h1>Advance Carousel : With Controls</h1>
  <!-- Carousel With Controls (If necessary it will keep it (not mandetory)) -->
  <div class="carousel slide" data-bs-theme="dark" data-bs-ride="carousel" id="banners1">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./images/slide1.png" height="200" class="w-100 d-block">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide2.png" height="200" alt="img 2" class="d-block w-100">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide3.png" height="200" alt="img 3" class="d-block w-100">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#banners1">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#banners1">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>



  <h1>Advance Carousel : With Controls (Indicators) </h1>
  <!-- Carousel Controls with indicators : here user can choose any one carousel-item without next and prev. it will direclty visit to any carousel item.> -->
  <div class="carousel slide" data-bs-theme="dark" data-bs-ride="carousel" id="banners">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="./images/slide1.png" height="200" class="w-100 d-block">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide2.png" height="200" alt="img 2" class="d-block w-100">
      </div>
      <div class="carousel-item ">
        <img src="./images/slide3.png" height="200" alt="img 3" class="d-block w-100">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#banners">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#banners">
      <span class="carousel-control-next-icon"></span>
    </button>
    <div class="carousel-indicators">
      <button class="active" data-bs-slide-to="0" data-bs-target="#banners"></button>
      <button data-bs-slide-to="1" data-bs-target="#banners"></button>
      <button data-bs-slide-to="2" data-bs-target="#banners"></button>
    </div>
  </div>


  <h1>Advance Carousel : With Controls (Indicators) and controls timming </h1>
  <!-- You can control the timing of every slide in carousel by using the attribute "data-bs-interval=1000" 1000miliseconds = 1sec. -->
  <div class="carousel slide" data-bs-theme="dark" data-bs-ride="carousel" id="banners2">
    <div class="carousel-inner">
      <div class="carousel-item active" data-bs-interval="3000">
        <img src="./images/slide1.png" height="200" class="w-100 d-block">
      </div>
      <div class="carousel-item " data-bs-interval="1000">
        <img src="./images/slide2.png" height="200" alt="img 2" class="d-block w-100">
      </div>
      <div class="carousel-item " data-bs-interval="5000">
        <img src="./images/slide3.png" height="200" alt="img 3" class="d-block w-100">
      </div>
    </div>
    <button class="carousel-control-prev" data-bs-slide="prev" data-bs-target="#banners2">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" data-bs-slide="next" data-bs-target="#banners2">
      <span class="carousel-control-next-icon"></span>
    </button>
    <div class="carousel-indicators">
      <button class="active" data-bs-slide-to="0" data-bs-target="#banners2"></button>
      <button data-bs-slide-to="1" data-bs-target="#banners2"></button>
      <button data-bs-slide-to="2" data-bs-target="#banners2"></button>
    </div>
  </div>

  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="../node_modules/jquery/dist/jquery.js"></script>

</body>

</html>
