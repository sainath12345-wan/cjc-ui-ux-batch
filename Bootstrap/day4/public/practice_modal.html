<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">

</head>

<body class="container-fluid">

  <button data-bs-toggle="modal" data-bs-target="#login" class="btn btn-primary mt-2">Login</button>

  <button data-bs-toggle="modal" data-bs-target="#details" class="btn btn-success mt-2">View Details</button>

  <button class="btn btn-warning mt-2" data-bs-toggle="modal" data-bs-target="#registration">Registration</button>


  <!-- Login Modal -->
  <div class="modal fade" id="login">
    <div class="modal-dialog modal-fullscreen">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="bi bi-person-fill">User Login</h1>
          <button class="btn btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <dl>
            <dt>User Name</dt>
            <dd><input type="text" class="form-control"></dd>
            <dt>Password</dt>
            <dd><input type="password" class="form-control"></dd>
          </dl>
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary">Login</button>
          <button class="btn btn-danger" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>


  <!-- Details Modal -->
  <div class="modal fade" id="details">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Women Fashion</h2>
          <button class="btn btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <img src="./images/young-woman-beautiful-yellow-dress.jpg" alt="women image" width="200" height="200">
        </div>
      </div>
    </div>
  </div>

  <!-- Registration Modal -->
  <div class="modal" id="registration">
    <div class="modal-dialog modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="bi bi-person-fill">Registration Form</h2>
          <button class="btn btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <dl>
            <dt>First Name</dt>
            <dd><input type="text" class="form-control"></dd>
            <dt>Last Name</dt>
            <dd><input type="text" class="form-control"></dd>
            <dt>Email</dt>
            <dd><input type="email" class="form-control"></dd>
            <dt>Password</dt>
            <dt><input type="password" class="form-control"></dt>
            <dt>First Name</dt>
            <dd><input type="text" class="form-control"></dd>
            <dt>Last Name</dt>
            <dd><input type="text" class="form-control"></dd>
            <dt>Email</dt>
            <dd><input type="email" class="form-control"></dd>
            <dt>Password</dt>
            <dt><input type="password" class="form-control"></dt>
          </dl>
        </div>
        <div class="modal-footer">
          <button class="btn-primary btn mt-2">Register</button>
          <button class="btn btn-danger mt-2" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../node_modules/jquery/dist/jquery.js"></script>
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
</body>

</html>
