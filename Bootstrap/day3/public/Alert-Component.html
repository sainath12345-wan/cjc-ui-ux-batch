<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap workshop : session - 3 (Alert Component) </title>

     <!-- Bootstrap CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container-fluid d-flex flex-column gap-3 p-5 align-items-center" style="height: 100vh;">

    <!-- Example 1 -->
    <form action="" class="alert alert-warning alert-dismissible " >
        <h3 class="bi bi-person-fill "> User Login </h3>
        <button class="btn btn-close" data-bs-dismiss="alert"></button>

        <!-- <button class="btn btn-link bi bi-cart " data-bs-dismiss="alert"></button> -->
        <dl>
            <dt>User Name</dt>
            <dd>
                <input type="text" name="username" id="username" class="form-control">
            </dd>
            <dt>Password</dt>
            <dd>
                <input type="password" name="password" id="password" class="form-control">
            </dd>
        </dl>
        <button class="btn btn-warning w-100">Login</button>
    </form>

    

    <!-- Example 2  : Delete Record-->
     <!-- if we use all alert classes appropriately then it will be make alert container as uniform. -->
    <div class="alert alert-danger alert-dismissible">
        <!-- write alert-title class for heading / title -->
        <h2 class="alert-title">Delete Record</h2>
        <button class="btn btn-close" data-bs-dismiss="alert"></button>
        <!-- write alert-subtitle for sub heading / sub title -->
        <p class="alert-subtitle">Record will be deleted permanently</p>
        <!-- write alert-link for links in the alert container -->
        <a href="#" class="alert-link">Help</a>
    </div>

    <!-- Example 3 : Insert Record -->

    <div class="alert alert-success alert-dismissible">
        <h2 class="alert-title">Inser Record</h2>
        <p class="alert-subtitle">Record Inserted</p>
        <a href="#" class="alert-link">Help</a>
        <br><br>
        <button class="btn btn-success" data-bs-dismiss="alert">OK</button>
    </div>
</body>
</html>
