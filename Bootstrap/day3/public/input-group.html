<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Workshop - Session : 3 (Input-group class)</title>

     <!-- Bootstrap CDN Links -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container-fluid d-flex justify-content-center align-items-center" style="height: 100vh;">
    <form action="">

        <!-- Amazon Search Bar Example -->

            <!-- If you want to group mutiple input filed in single palce then use input-group class. -->
            <div class="input-group ">
                <!-- If anyone content to highlight then use input-group-text class for that content -->
                <select name="" id="" class="input-group-text">
                    <option value="">All</option>
                </select>
                <input type="text" class="form-control" name="" id="" placeholder="Search Amazon.in">
                <button class="bi bi-search btn btn-warning"></button>
            </div>

  
        <!-- Netflix Register component Example -->
            <div class="mt-3 input-group">
                <input type="email" name="" id="" placeholder="Your email address" class="form-control" >
                <button class="btn btn-danger ms-2">Get Started <span class="bi bi-chevron-right"></span></button>
            </div>

        <!-- General password component example -->

        <div class="mt-4 input-group">
            <span class="bi bi-key-fill input-group-text"></span>
            <input type="password" class="form-control" name="" id="">
            <span class="bi bi-check-square input-group-text"></span>
        </div>

        <!-- We can not insert the icons inside the input but we can attach the icons with the input filed by uisng input-group class as per above code. -->
    </form>
</body>
</html>
