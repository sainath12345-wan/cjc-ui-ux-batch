<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-workshop : session-6 (badge)</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
</head>
<body class="container-fluid">
    
    <!-- Pagination in bootstrap -->
     <!-- 
    
     &laquo;   for  << 
     &raquo;   for  >>
     -->
    <h2>Pagination</h2>
    <ul class="pagination">
        <li class="page-item"><a class="page-link"> &laquo;</a></li>
        <li class="page-item"><a class="page-link">1</a></li>
        <li class="page-item"><a class="page-link">2</a></li>
        <!-- .active class in  page-item used for active page-item -->
        <li class="page-item active" ><a class="page-link">3</a></li>
        <!-- .disabled class is  used which is show disabled item. -->
        <li class="page-item disabled"><a class="page-link">4</a></li>
        <li class="page-item"><a class="page-link"> &raquo; </a></li>
    </ul>

    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../node_modules/jquery/dist/jquery.js"></script>
</body>
</html>
