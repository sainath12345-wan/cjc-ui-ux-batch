<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap-workshop : session-6 (badge)</title>
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">
</head>
<body class="container-fluid">
    <!-- spinners bootstrap -->
    <h2>Spinners</h2>
    <!-- type of spinner : rotating spinner -->
    <div class="spinner-border text-success">
        <!-- we can kept anything but not recommended. -->
        50%
    </div>
    <!-- type of spinner : blink spinner -->
    <div class="spinner-grow text-danger">

    </div>

    <button class="btn btn-primary">
        <span class="spinner-border"></span> Loading...
    </button>
    
    <!-- get a small size spinner -->
    <button class="btn btn-primary">
        <span class=" spinner-border spinner-border-sm"></span> Loading...
    </button>
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <script src="../node_modules/jquery/dist/jquery.js"></script>
</body>
</html>
