<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bootstrap : container</title>

  <!-- bootstrap style sheet links -->
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.css">

  <!-- custom style sheet links -->
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/media.css">
</head>


<body>
  <!-- it will 100% width  and 12px with left and right in all screen becase it uses .container-fluid  -->

  <div class="container-fluid bg-danger">
    Helllo

    <!-- container-xxl takes 100% width with screens less than 1400 but when screen size is greater than or equal to 1400px it will take width is 1320px -->
    <div class="container-xxl bg-success">

    </div>
  </div>

  <!-- bootstrap scripts -->
  <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
  <script src="../node_modules/jquery/dist/jquery.js"></script>


</body>

</html>
