<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap session : File Structure </title>

    <!-- always add first Bootstrap css and then own css so that properly override our own css to that Bootstrap css. -->

     <link rel="stylesheet" href="./css/media.css">
</head>
<body>
    
    <h1 class="text-lg-center  text-sm-end text-start">Welcome to WscubeTech</h1>

     <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
