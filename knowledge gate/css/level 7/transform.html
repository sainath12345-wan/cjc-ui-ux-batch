    <title>CSS : Transform</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: plum;
            position: relative;
            top: 50px;
            left: 50px;

            transition: all 0.5s ease-in;
        }

        .box:hover{

            /* transform: rotate(deg); */


            /* transform: rotate(270deg); it will rotate in by deault z-axis */
            /* transform: rotateX(45deg);   it will rotate in x-axis. */

            /* transform: rotateY(45deg); it will rotate in y-axis */

            /* transform: rotateZ(45deg); it will rotate in z-axis and it is by default nature */

            /* transform: rotate3d(45deg); */

            /* transform: rotate(45deg); */

            /* transform: scale(how many times of original) */

            /* transform: scale(2); it will scale twise in all direction  */

            /* transform: scale(0.5); it will scale half in all direction. */

            /* transform: scaleX(2); it will scale twice in x-direction. */

            /* transform: scaleY(2); it will scale twice in y-direction. */

            /* transform: scaleZ(2); it will scale twice in z-index: direction ; */

            /* 
            
            transform: translate(x-direction_value y-direction_value); 
            transform: translate(value); 
            
            */

            /* transform: translate(50px);  translate 50px in right direction.*/
            /* transform: translate(-50px); translate 50px in left direction. */
            /* transform: translate(50px,50px); translate 50px in right and left direction. (diagonally)*/
            /* transform: translateY(50px); translte 50px in downward direction. */
            /* transform: translateY(-50px); translate 50px in upward direction. */

            /* transform: skew(45deg);  the plane is slant at 45 deg. and return back its original state */

            /* transform: skew(90deg); the plane is slant at 90 deg. and return back its original state */

            /* transform: skew(180deg);  the plane is slant at 180 deg. and return back its original state */

            /* transform: skewX(45deg); the plane is slant at 45 deg in x-direction. and return back its original state */

            /* transform: skewY(45deg); the plane is slant at 45 deg in y-direction. and return back its original state */

        } 

    </style>
</head>
<body>
    <div class="box">Rotate</div>
</body>
