<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS : Transform</title>
    <style>
        .container{
            /* background-color: red; */
            border: 2px solid green;
            width: 300px;
            height: 300px;

        }

        .box{
            height: 75px;
            width: 75px;
            border: 2px solid black;
            border-radius: 5px;
            background-color: plum;
            position: relative;
            top: 10px;
            left: 10px;

            /* animation */
            animation-name: ghumakkad;
            animation-duration: 5s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            /* animation-direction: normal; by default left to right */

            /* animation-direction: reverse; */
            /* animation-direction: alternate-reverse; */

            /* 
            
            shorthand property for animation 
            
            animation : animation-name animation-duration animation-timing-function animation-delay animation-iteration-count animation-direction ;
            */

            /* animation: ghumakkad 4s ease-in-out 0s 4 alternate; */

            animation: ghumakkad 4s ease-in-out 0s infinite alternate-reverse ;
        
        }

        .container .box:hover{
            animation-play-state: paused;
        }
        
        @keyframes ghumakkad {
            /* from {left: 10px;}
            to {left: 200px;} */

            0%{
                left: 0px ;
                top: 0px;
            }

            25%{
                left: 200px;
                top: 0px;
            }

            50%{
                left: 200px;
                top: 200px;
            }

            75%{
                top: 200px;
                left: 0px;
            }
        }

        
 

      

    </style>
</head>
<body>
    <div class="container">
        <div class="box">Animate1</div>
    </div>
</body>
</html>
