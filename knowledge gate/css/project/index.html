<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myntra Clone</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=search" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <header>
        <div class="logo_container">
            <a href="#"><img class="myntra_home" src="./images/myntra_logo.png" alt="Myntra Home"></a>
        </div>
        <div class="nav_bar">
            <a href="#">Men</a>
            <a href="#">Women</a>
            <a href="#">Kids</a>
            <a href="#">Home & Living</a>
            <a href="#">Beauty</a>
            <a href="#">Studio <sup>New</sup></a>
        </div>
        <div class="search_bar">
            <span class="material-symbols-outlined search_icon">search</span>
            <input class="search_input" type="text" name="" id="" placeholder="Search for products, brands and more">
        </div>
        <div class="action_bar">
            <div class="action_container">
                <span class="action_icon" ><i class="fa-solid fa-user"></i></span>
                <span class="action_name">Profile</span>
            </div>
            <div class="action_container">
                <span class="action_icon" ><i class="fa-regular fa-heart"></i></span>
                <span class="action_name">Wishlist</span>
            </div>
            <div class="action_container">
                <span class="action_icon" ><i class="fa-solid fa-bag-shopping"></i></span>
                <span class="action_name">Bag</span>
            </div>
          
        </div>
    </header>
    <main>
        <div class="banner_container">Banner Container</div>
        <div class="category_heading">Category Heading</div>
        <div class="caterogy_items">Items</div>
    </main>
    <footer>Footer</footer>
</body>
</html>
