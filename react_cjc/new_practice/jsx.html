<!DOCTYPE html>
<html lang="en">

<head>

  <title>Document</title>

<body>

  <script type="text/babel">

    // const Header = <header>This is header component.</header>
    // const main = <main>This is Main Componenet.</main>
    // const footer = <footer>This is Footer Component.</footer>

    const Header = () => {
      return <>
        <h1>This is Header Component.</h1>
        <div className="container header">
          <div className="left-part">
            <h1>Sainath</h1>

          </div>
          <div className="nav">

            <a href="#">More</a>
          </div>

      </>
    }

      </>
    }

      return <>

      </>
